{% extends 'base.html' %}{% block title %}Sign in · DailyWork{% endblock %}{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-4">Sign in</h1><form method="post">
<input type="hidden" name="csrf_token" value="{{csrf_token}}">
<div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" name="email" required autocomplete="email"></div>
<div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" type="password" name="password" required autocomplete="current-password"></div>
<button class="btn btn-primary w-100">Sign in</button></form>
</div></div></div></div>{% endblock %}
